<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b9b9c6"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9b9c6"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- маскот -->
  <g transform="translate(600 150)">
    <rect x="-46" y="-44" width="92" height="92" rx="25" fill="#0b0b0d" stroke="#ffffff" stroke-opacity="0.14"/>
    <g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#f3f3f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="16" height="11" rx="3"/>
      <path d="M12 8V4M9 4h6M9.5 16.5h5"/>
      <path d="M9 13h.01M15 13h.01"/>
    </g>
  </g>

  <!-- логотип -->
  <text x="600" y="350" text-anchor="middle" font-family="'Syne','Segoe UI',Arial,sans-serif" font-weight="800" font-size="76" letter-spacing="1" fill="#f3f3f6">SIBERI<tspan fill="url(#brand)">.AI</tspan></text>

  <!-- слоган -->
  <text x="600" y="412" text-anchor="middle" font-weight="500" font-size="30" fill="#b9b9c6">Персональная нейросеть для вашего бизнеса</text>

  <!-- подпись -->
  <text x="600" y="476" text-anchor="middle" font-weight="400" font-size="22" fill="#74747e">Запуск за вечер · Telegram · VK · виджет · API</text>

  <!-- нижняя плашка -->
  <text x="600" y="566" text-anchor="middle" font-weight="500" font-size="20" fill="#4a4a52" letter-spacing="2">SIBERI.ONLINE</text>
</svg>
