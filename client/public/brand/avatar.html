<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07001e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px;font-family:system-ui,sans-serif}
canvas{border-radius:50%}
button{padding:13px 40px;background:rgba(100,40,210,.6);color:#e5d0ff;border:1.5px solid rgba(200,170,255,.3);border-radius:999px;font:600 14px/1 system-ui,sans-serif;cursor:pointer;transition:background .2s}
button:hover{background:rgba(130,60,240,.8)}
p{color:rgba(196,181,253,.35);font-size:11px}
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<button onclick="dl()">⬇ Скачать PNG</button>
<p>800×800px</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),S=800;
let staticCv=null;

// ── Отрисовка статичного фона, иконки и текста ──────────────────────────────
function drawStatic(ctx){
  const bg=ctx.createLinearGradient(0,0,0,S);
  bg.addColorStop(0,'#07001e');bg.addColorStop(.6,'#0b0030');bg.addColorStop(1,'#05000f');
  ctx.fillStyle=bg;ctx.fillRect(0,0,S,S);

  const gl=ctx.createRadialGradient(S/2,S*.4,0,S/2,S*.4,350);
  gl.addColorStop(0,'rgba(110,30,210,.24)');gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gl;ctx.fillRect(0,0,S,S);

  botIcon(ctx,S/2,295,400);

  const tg=ctx.createLinearGradient(S/2-270,0,S/2+270,0);
  tg.addColorStop(0,'#b8a0f8');tg.addColorStop(.22,'#c4b5fd');
  tg.addColorStop(.42,'#ddd4ff');tg.addColorStop(.5,'#f0ecff');
  tg.addColorStop(.58,'#ddd4ff');tg.addColorStop(.78,'#c4b5fd');tg.addColorStop(1,'#b8a0f8');

  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowBlur=35;ctx.shadowColor='rgba(167,139,250,.55)';
  ctx.font='800 140px "Plus Jakarta Sans"';
  ctx.fillStyle=tg;ctx.fillText('Siberi AI',S/2,548);
  ctx.shadowBlur=0;
}

function botIcon(ctx,cx,cy,size){
  const sc=size/24;
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-12,-12);
  ctx.shadowBlur=45;ctx.shadowColor='rgba(180,145,255,.85)';
  ctx.strokeStyle='#c4b5fd';ctx.lineWidth=1.8;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(12,8);ctx.lineTo(12,4);ctx.lineTo(8,4);ctx.stroke();
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(4,8,16,12,2);
  else{ctx.moveTo(6,8);ctx.lineTo(18,8);ctx.arcTo(20,8,20,10,2);ctx.lineTo(20,18);ctx.arcTo(20,20,18,20,2);ctx.lineTo(6,20);ctx.arcTo(4,20,4,18,2);ctx.lineTo(4,10);ctx.arcTo(4,8,6,8,2);ctx.closePath();}
  ctx.stroke();
  ctx.beginPath();ctx.moveTo(2,14);ctx.lineTo(4,14);ctx.stroke();
  ctx.beginPath();ctx.moveTo(20,14);ctx.lineTo(22,14);ctx.stroke();
  ctx.beginPath();ctx.moveTo(15,13);ctx.lineTo(15,15);ctx.stroke();
  ctx.beginPath();ctx.moveTo(9,13);ctx.lineTo(9,15);ctx.stroke();
  ctx.restore();
}

// ── Анимированное кольцо ────────────────────────────────────────────────────
function drawRing(ts){
  const R=381,LW=15;

  // 1. Базовый тёмный контур
  g.beginPath();g.arc(S/2,S/2,R,0,Math.PI*2);
  g.strokeStyle='rgba(90,30,180,.55)';g.lineWidth=LW;g.stroke();

  // 2. Мягкое свечение всего кольца
  g.filter='blur(10px)';
  g.beginPath();g.arc(S/2,S/2,R,0,Math.PI*2);
  g.strokeStyle='rgba(130,60,220,.35)';g.lineWidth=LW+8;g.stroke();
  g.filter='none';

  // 3. Яркий шиммер — дуга движется по кругу
  const speed=5500; // мс на полный оборот
  const a=(ts/speed)*Math.PI*2 - Math.PI/2;
  const arcSpan=1.1; // ~63°

  // Градиент по касательной к дуге
  const mx=S/2+Math.cos(a+arcSpan/2)*R, my=S/2+Math.sin(a+arcSpan/2)*R;
  const ex=S/2+Math.cos(a)*R,          ey=S/2+Math.sin(a)*R;
  const sg=g.createLinearGradient(ex,ey,mx,my);
  sg.addColorStop(0,  'rgba(255,255,255,0)');
  sg.addColorStop(0.3,'rgba(210,180,255,.7)');
  sg.addColorStop(0.65,'rgba(240,225,255,.95)');
  sg.addColorStop(1,  'rgba(180,140,255,.5)');

  g.beginPath();g.arc(S/2,S/2,R,a,a+arcSpan);
  g.strokeStyle=sg;g.lineWidth=LW;
  g.shadowBlur=22;g.shadowColor='rgba(215,190,255,.75)';
  g.stroke();
  g.shadowBlur=0;

  // 4. Яркая точка в голове шиммера
  const hx=S/2+Math.cos(a+arcSpan)*R, hy=S/2+Math.sin(a+arcSpan)*R;
  g.beginPath();g.arc(hx,hy,5,0,Math.PI*2);
  g.fillStyle='rgba(255,255,255,.92)';
  g.shadowBlur=18;g.shadowColor='rgba(230,215,255,1)';
  g.fill();g.shadowBlur=0;
}

// ── Петля ──────────────────────────────────────────────────────────────────
async function init(){
  await document.fonts.load('800 140px "Plus Jakarta Sans"');

  staticCv=document.createElement('canvas');
  staticCv.width=S;staticCv.height=S;
  drawStatic(staticCv.getContext('2d'));

  requestAnimationFrame(loop);
}

function loop(ts){
  g.clearRect(0,0,S,S);
  g.drawImage(staticCv,0,0);
  drawRing(ts);
  requestAnimationFrame(loop);
}

init();

function dl(){const a=document.createElement('a');a.download='siberi-avatar.png';a.href=cv.toDataURL('image/png');a.click();}
</script>
</body>
</html>
