    <!-- Анти-FOUC. SPA отдаёт этот index.html на ВСЕХ маршрутах. Скрипт
         парсер-блокирующий и стоит до <body> — отрабатывает ДО первой
         отрисовки и красит подложку <html> под цель маршрута, чтобы не было
         белой вспышки. Тёмные — главная (app) и кабинет; светлые — лендинг
         (/about) и юр-страницы (красят себя сами). SEO-фолбэк живёт в
         <noscript> (виден краулерам без JS, невидим пользователю — без FOUC). -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          var LIGHT = { '/about': 1, '/welcome': 1, '/oferta': 1, '/privacy': 1 };
          if (LIGHT[p]) return; // светлые страницы красят фон сами
          var r = document.documentElement;
          r.className += ' sb-boot-app';
          // Кабинет уважает выбранную тему; главная «/» и app — всегда тёмные.
          if (p !== '/' && p !== '/index.html' && p !== '/app' &&
              localStorage.getItem('siberi-theme') === 'light') {
            r.className += ' sb-boot-light';
          }
        } catch (e) { /* приватный режим — переживём мелькание */ }
      })();
    </script>
    <style>

      html.sb-boot-app { background: #08090a; }
      html.sb-boot-app.sb-boot-light { background: #c9c9d0; }
    </style>
